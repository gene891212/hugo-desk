<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src {{HUGO_ORIGIN}}; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #fff; }
  body { display: flex; flex-direction: column; font-family: var(--vscode-font-family, sans-serif); }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    background: var(--vscode-editorWidget-background, #f3f3f3);
    border-bottom: 1px solid var(--vscode-widget-border, #ccc);
    flex: 0 0 auto;
  }
  #toolbar button {
    all: unset;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 3px;
    font-size: 13px;
    line-height: 1;
    color: var(--vscode-foreground, #333);
  }
  #toolbar button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128, 128, 128, 0.2)); }
  #urlbar {
    flex: 1 1 auto;
    font-size: 12px;
    color: var(--vscode-input-foreground, #333);
    background: var(--vscode-input-background, #fff);
    border: 1px solid var(--vscode-input-border, #ccc);
    border-radius: 3px;
    padding: 3px 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: all;
  }
  #frame { display: block; width: 100%; height: 100%; border: 0; flex: 1 1 auto; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="reload" title="Reload">&#8635;</button>
  <div id="urlbar"></div>
  <button id="open-external" title="Open in external browser">&#8599;</button>
</div>
<iframe id="frame" src="{{PREVIEW_URL}}"></iframe>
<script>
  const host = acquireVsCodeApi();
  const frame = document.getElementById('frame');
  const urlbar = document.getElementById('urlbar');
  let currentUrl = frame.src;
  const allowedOrigin = new URL(currentUrl).origin;
  let following = {{FOLLOWING}};
  const saveState = () => host.setState({ url: currentUrl, following });

  function reload() {
    // Cross-origin access blocks location.reload(); bounce through a blank page.
    frame.src = 'about:blank';
    requestAnimationFrame(() => { frame.src = currentUrl; });
  }

  function navigate(url, forceReload = false) {
    // Opening the Markdown editor for the page that is already being
    // previewed sends the same URL again. Reassigning iframe.src in that
    // case reloads the whole page and loses its scroll position.
    if (url === currentUrl) {
      if (forceReload) reload();
      return;
    }
    currentUrl = url;
    urlbar.textContent = url;
    frame.src = url;
    saveState();
  }

  // The iframe already has its initial src in the markup. Initialising the
  // surrounding UI directly avoids loading that first page a second time.
  urlbar.textContent = currentUrl;
  saveState();

  document.getElementById('reload').addEventListener('click', reload);

  document.getElementById('open-external').addEventListener('click', () => {
    host.postMessage({ type: 'openExternal', url: currentUrl });
  });

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (message && message.type === 'navigate') {
      // Only the currently selected local origin may navigate this iframe.
      try {
        const target = new URL(message.url);
        if (target.protocol === 'http:' && target.origin === allowedOrigin && !target.username && !target.password) {
          navigate(message.url, message.reload === true);
        }
      } catch { /* Ignore malformed navigation messages. */ }
    } else if (message && message.type === 'following') {
      following = message.value === true;
      saveState();
    }
  });
  host.postMessage({ type: 'ready' });
</script>
</body>
</html>
