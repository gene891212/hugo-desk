name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - run: hugo version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Editor lifecycle checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:editor
      - name: Editor lifecycle checks (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:editor
      - run: npm audit
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: hugo-desk-${{ matrix.os }}
          path: '*.vsix'
